name: Build Android APK (BEAT CONTROL)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Artifact APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Получение исходного кода
        uses: actions/checkout@v4

      - name: 2. Настройка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Установка и настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Сборка APK через Gradle
        run: gradle assembleDebug --no-daemon

      - name: 5. Проверка наличия и ненулевого размера APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Файл APK не найден по пути $APK_PATH"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Размер APK: $FILE_SIZE байт"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::Файл APK имеет нулевой размер!"
            exit 1
          fi

          echo "APK успешно создан и валиден!"

      - name: 6. Публикация APK в Артефакты GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BeatControl-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
